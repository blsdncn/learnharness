              - paragraph [ref=e472]: A campus operator wants to know whether poor Zoom calls are caused by campus connectivity or by conditions elsewhere. What different evidence could RIPE Atlas measurements and a passive capture of the campus’s actual Zoom traffic provide, and why would neither alone settle every case?
              - generic [ref=e473]: “ripe atlas measurements might tell you the status of the traversal through the ip layer of perhaps flows that are associated with zoom traffic passive capture of campus zoom traffic allows you to take more specific measurements of zoom call behavior by analyzing the packet captures.”
              - generic [ref=e474]:
                - text: "The answer:"
                - paragraph [ref=e476]: "RIPE Atlas can run active measurements such as ping and traceroute from selected distributed probes, giving controlled observations of reachability, RTT, and routes from multiple external vantage points. This helps test whether a problem is local or more widespread, but probes and synthetic traffic may not share the affected users' paths, protocols, timing, or access conditions. Passive campus capture observes the actual Zoom sessions at its capture point without generating test traffic. Packet timing and visible protocol metadata can support estimates of application-related performance and traffic behavior. However, encrypted content, incomplete protocol knowledge, the capture location, and a lack of direct endpoint or user-experience visibility constrain inference. The two sources complement one another: broad controlled external observations versus actual application traffic at a particular location; neither automatically identifies the root cause or directly measures perceived call quality."
