              - paragraph [ref=e333]: What information does CSIG give a datacenter transport that ordinary ECN does not, and how does CSIG’s packet-header design try to make that information practical to collect on switches?
              - generic [ref=e334]: “I can't quite remember. I feel like CSIG was something to do with the link layer, ECN something happens where you mark something as congested and when the receiver gets that itll send back a ECN.”
              - generic [ref=e335]:
                - text: "The answer:"
                - paragraph [ref=e337]: Ordinary ECN marks a packet with a congestion indication but does not directly encode a precise congestion metric or the location of the responsible bottleneck. CSIG carries richer, quantized path telemetry, including bottleneck-related metric values and location information, which transports and operators can use for faster rate adaptation and diagnosis. Its design uses a small fixed-size Layer-2 tag rather than growing a packet with a record for every hop. Switches can update the relevant path aggregate in the tag, and different packets can request or carry different signals. This balances signal detail against packet overhead and switch parsing/processing limitations. The deployment claim is chiefly within managed datacenters, not arbitrary Internet paths.
