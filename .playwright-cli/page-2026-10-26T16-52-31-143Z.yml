              - paragraph [ref=e489]: A passive monitor sees encrypted video traffic arriving at a steady bitrate with no obvious packet loss. Is that enough to conclude that the user is receiving smooth, high-quality video? Explain what the monitor still does not know.
              - generic [ref=e490]: “A passive monitor might not be able to tell you the resolution and frame rate”
              - generic [ref=e491]:
                - text: "The answer:"
                - paragraph [ref=e493]: No. A steady bitrate and no obvious loss at one observation point do not establish video quality at the endpoint. The bitrate may encode low-resolution or otherwise low-quality video, and packet arrival behavior at the monitor need not equal delivery and playback behavior at the receiver. The monitor may lack frame boundaries, frame timestamps, codec/resolution information, receiver buffering and rendering behavior, and visibility into loss after the capture point. Packets may arrive too late for real-time playback even if they arrive eventually. Encrypted payloads can prevent directly inspecting decoded quality, although visible metadata can still permit useful estimates. Network-level observations must be connected to media-level and endpoint behavior rather than treated as direct proof of perceived quality.
