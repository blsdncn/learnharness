              - generic [ref=e125]:
                - text: "The answer:"
                - paragraph [ref=e127]: "Once the bottleneck is fully utilized, increasing the congestion window cannot increase sustained throughput beyond the bottleneck's available service rate. Additional in-flight data mostly builds a queue, increasing queueing delay and measured RTT; eventually a finite queue overflows and drops packets. With three duplicate ACKs, Reno performs fast retransmit and fast recovery: it sets the slow-start threshold to about half the flight size, retransmits the missing segment without waiting for a timeout, temporarily inflates the congestion window during recovery, and then continues congestion avoidance at approximately the halved window. A retransmission timeout is a stronger response: it reduces the congestion window to one segment in classic Reno, sets the threshold to about half the prior flight size, and restarts slow start. The key distinction is a roughly halved operating window after duplicate-ACK recovery versus restarting with a very small window after timeout."
