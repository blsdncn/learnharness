                - paragraph [ref=e664]: A single central switch is limited by port count and capacity and creates a large failure domain. A multi-stage Clos fabric combines many smaller switches to provide multiple paths between racks, scalable aggregate/bisection bandwidth, and redundancy when links or switches fail. Its parallel paths are intended to carry traffic concurrently, not merely serve as standby backups. Ordinary spanning-tree forwarding disables redundant links to prevent Layer-2 loops and would discard much of that available path capacity. ECMP selects among equal-cost next hops, typically by hashing flow-header fields so packets of a flow generally follow the same path. It spreads flows but does not guarantee equal byte load or avoid collisions among large flows; topology alone does not guarantee a non-oversubscribed network.
