              - generic [ref=e243]:
                - text: "The answer:"
                - paragraph [ref=e245]: A delivery-rate sample may be below bottleneck capacity because the sender is application-limited or is not sending enough to fill the path, so BBR uses a windowed maximum of suitable delivery-rate samples to estimate bottleneck bandwidth. RTT includes propagation and other baseline path delays plus variable queueing delay, so a windowed minimum estimates round-trip propagation time with minimal queueing. Their product is the bandwidth-delay product, the approximate amount of data that must be in flight to keep the bottleneck busy without a persistent queue. This product is an operating reference, not a promise that all BBR versions keep their congestion window exactly at one BDP; pacing, probing, and an inflight cap are distinct controls.
